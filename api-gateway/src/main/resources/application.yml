server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      routes:

        - id: order-service

          uri: http://order-service:8080

          predicates:
            - Path=/orders,/orders/**

        - id: notification-service

          uri: http://notification-service:8080

          predicates:
            - Path=/realtime,/realtime/**

      globalcors:

        corsConfigurations:

          '[/**]':

            allowedOrigins:
              - "http://localhost"
              - "http://localhost:4200"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS

            allowedHeaders: "*"

            allowCredentials: true